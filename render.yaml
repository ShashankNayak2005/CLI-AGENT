services:
  - type: web
    name: cli-agent-ai
    env: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./cli_agent.db
      - key: CORS_ORIGINS
        value: "*"
