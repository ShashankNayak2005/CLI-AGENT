services:
  - type: web
    name: cli-agent-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./cli_agent.db
      - key: CORS_ORIGINS
        value: "*"
